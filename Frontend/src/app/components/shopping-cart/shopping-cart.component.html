<main class="mt-3">
  <div class="container-fluid">
    <div class="row">
      <h4>Shopping Cart : </h4>
      <hr/>
      <div class="table-reponsive">
        <table class="table table-hover table-striped">
          <thead class="bg-secondary text-light">
            <tr>
              <th class="pt-3 pb-3">Sr No.</th>
              <th class="pt-3 pb-3">Product</th>
              <th class="pt-3 pb-3">Price</th>
              <th class="pt-3 pb-3">Quantity</th>
              <th class="pt-3 pb-3">Total</th>
            </tr>
          </thead>
          <tbody>
          <tr *ngFor="let product of products">
            <td class="align-middle">{{ product.sNo }}</td>
            <td class="align-middle"><a [routerLink]="['/product-details', product.sNo]"><img [src]="product.imgSrc" alt="" class="img-fluid" height="50" width="50"/> {{ product.title }}</a></td>
            <td class="align-middle">{{ product.price | currency: 'INR' }}</td>
            <td class="align-middle"><i class="fa fa-minus-square fs-5" (click)="decrementQuantity(product.sNo)"></i> {{ product.quantity }} <i class="fa fa-plus-square fs-5" (click)="incrementQuantity(product.sNo)"></i></td>
            <td class="align-middle">{{ product.price * product.quantity | currency: 'INR' }}</td>
          </tr>
          </tbody>
          <tfoot class="bg-secondary text-light">
            <tr>
              <td colspan="3" class="align-middle p-3"></td>
              <td class="text-end align-middle p-3 fw-bolder">Grand Total :</td>
              <td class="p-3 fw-bolder">{{ grandTotal() | currency: 'INR' }}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
</main>
